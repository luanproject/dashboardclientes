<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Vendas</title>
  <!-- Biblioteca para leitura de arquivos Excel (XLSX) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      padding: 20px;
      margin-bottom: 25px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #1a252f;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background-color: #f0f4f8;
      color: #4a5568;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #718096;
      margin-top: -10px;
      margin-bottom: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th {
      background-color: #f8fafc;
      color: #475569;
      text-align: left;
      padding: 12px 10px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #e2e8f0;
    }
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #f1f5f9;
    }
    tr:hover {
      background-color: #f8fafc;
    }
    .text-right {
      text-align: right;
    }
    .tag-pos {
      background-color: #d1fae5;
      color: #065f46;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .tag-neg {
      background-color: #ffe4e6;
      color: #9f1239;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.8rem;
    }
    input[type="file"] {
      margin-bottom: 20px;
      padding: 10px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Painel de Análise Comercial</h2>
  
  <!-- Upload do Arquivo -->
  <div class="card">
    <label for="fileInput"><strong>Selecione o arquivo Excel (.xlsx):</strong></label><br><br>
    <input type="file" id="fileInput" accept=".xlsx, .xls" />
  </div>

  <!-- Tabela de Ranking por Cliente Individual -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">
        <span>🏪</span> Ranking por Cliente Individual (2026)
      </div>
      <div class="badge" id="totalClientesInd">0 clientes</div>
    </div>
    <div class="subtitle">Desempenho detalhado por código de cliente individual</div>
    
    <table>
      <thead>
        <tr>
          <th>CÓD. / CLIENTE INDIVIDUAL</th>
          <th class="text-right">VL. MERC. 2025</th>
          <th class="text-right">VL. MERC. 2026</th>
          <th class="text-right">% VAR MERC.</th>
          <th class="text-right">VOL. 2025 (LT)</th>
          <th class="text-right">VOL. 2026 (LT)</th>
          <th class="text-right">% VAR VOL</th>
        </tr>
      </thead>
      <tbody id="tbodyClienteIndividual">
        <tr>
          <td colspan="7" style="text-align: center; color: #999;">Aguardando envio do arquivo Excel...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // ============================================================================
  // 1. FUNÇÕES AUXILIARES DE BUSCA E TRATAMENTO DE DADOS
  // ============================================================================

  // Procura um valor na linha testando vários nomes de colunas possíveis
  function getVal(d, colNames, defaultValue = '') {
    if (!d) return defaultValue;
    for (let col of colNames) {
      if (d[col] !== undefined && d[col] !== null && String(d[col]).trim() !== '') {
        return d[col];
      }
    }
    return defaultValue;
  }

  // Identifica o Cliente Individual combinando CÓDIGO + NOME
  function getClienteIndividual(d) {
    // Busca o código do cliente (incluindo 'Cliente - Código')
    let cod = getVal(d, [
      'Cliente - Código', 'Cliente - Codigo', 'Código Cliente', 'Codigo Cliente', 
      'Cod. Cliente', 'Cod Cliente', 'Código', 'Codigo', 'Cod', 'CD_CLIENTE', 'COD_CLIENTE'
    ], false);

    // Busca a Razão Social / Nome do cliente
    let nome = getVal(d, [
      'Cliente - Matriz Razão', 'Cliente', 'Razão Social', 'Razao Social', 
      'Nome Cliente', 'NM_CLIENTE'
    ], false);

    cod = cod ? String(cod).trim() : '';
    nome = nome ? String(nome).trim() : '';

    if (cod && nome) {
      if (nome.startsWith(cod)) return nome;
      return `${cod} - ${nome}`; // Exemplo: "67927 - CONDOR ATAC"
    }

    return cod || nome || 'CLIENTE NÃO IDENTIFICADO';
  }

  // Formatadores de Moeda e Números
  function formatMoney(val) {
    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
  }

  function formatNumber(val) {
    return new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 }).format(val || 0);
  }

  function formatPercent(val) {
    const formatted = (val || 0).toFixed(1).replace('.', ',') + '%';
    if (val > 0) return `<span class="tag-pos">+${formatted}</span>`;
    if (val < 0) return `<span class="tag-neg">${formatted}</span>`;
    return `<span>${formatted}</span>`;
  }

  // ============================================================================
  // 2. PROCESSAMENTO E AGRUPAMENTO DOS DADOS
  // ============================================================================

  function processarDados(dados) {
    const agrupado = {};

    dados.forEach(linha => {
      const clienteChave = getClienteIndividual(linha);

      if (!agrupado[clienteChave]) {
        agrupado[clienteChave] = {
          cliente: clienteChave,
          vlMerc2025: 0,
          vlMerc2026: 0,
          vol2025: 0,
          vol2026: 0
        };
      }

      // Converte os valores para formato numérico tratando vírgulas se necessário
      const parseNum = (v) => {
        if (typeof v === 'number') return v;
        if (!v) return 0;
        return parseFloat(String(v).replace(/\./g, '').replace(',', '.')) || 0;
      };

      agrupado[clienteChave].vlMerc2025 += parseNum(getVal(linha, ['VL. MERC. 2025', 'Vl Merc 2025', 'Valor 2025'], 0));
      agrupado[clienteChave].vlMerc2026 += parseNum(getVal(linha, ['VL. MERC. 2026', 'Vl Merc 2026', 'Valor 2026'], 0));
      agrupado[clienteChave].vol2025 += parseNum(getVal(linha, ['VOL. 2025 (LT)', 'Vol 2025', 'Volume 2025'], 0));
      agrupado[clienteChave].vol2026 += parseNum(getVal(linha, ['VOL. 2026 (LT)', 'Vol 2026', 'Volume 2026'], 0));
    });

    const resultado = Object.values(agrupado).map(item => {
      const varMerc = item.vlMerc2025 > 0 ? ((item.vlMerc2026 - item.vlMerc2025) / item.vlMerc2025) * 100 : 0;
      const varVol = item.vol2025 > 0 ? ((item.vol2026 - item.vol2025) / item.vol2025) * 100 : 0;
      return { ...item, varMerc, varVol };
    });

    // Ordena do maior para o menor valor em 2026
    return resultado.sort((a, b) => b.vlMerc2026 - a.vlMerc2026);
  }

  // ============================================================================
  // 3. RENDERIZAÇÃO NA TELA
  // ============================================================================

  function renderizarTabela(lista) {
    const tbody = document.getElementById('tbodyClienteIndividual');
    document.getElementById('totalClientesInd').innerText = `${lista.length} clientes`;

    if (lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Nenhum dado encontrado.</td></tr>';
      return;
    }

    tbody.innerHTML = lista.map(item => `
      <tr>
        <td><strong>${item.cliente}</strong></td>
        <td class="text-right">${formatMoney(item.vlMerc2025)}</td>
        <td class="text-right"><strong>${formatMoney(item.vlMerc2026)}</strong></td>
        <td class="text-right">${formatPercent(item.varMerc)}</td>
        <td class="text-right">${formatNumber(item.vol2025)}</td>
        <td class="text-right"><strong>${formatNumber(item.vol2026)}</strong></td>
        <td class="text-right">${formatPercent(item.varVol)}</td>
      </tr>
    `).join('');
  }

  // Listener para leitura do arquivo Excel
  document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      
      const jsonDados = XLSX.utils.sheet_to_json(worksheet);
      const dadosProcessados = processarDados(jsonDados);
      
      renderizarTabela(dadosProcessados);
    };
    reader.readAsArrayBuffer(file);
  });
</script>

</body>
</html>
